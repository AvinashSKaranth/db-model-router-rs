[workspace]
resolver = "2"
members = [
    "crates/dbmr-core",
    "crates/dbmr-schema",
    "crates/dbmr-adapters",
    "crates/dbmr-http",
    "crates/dbmr-kafka",
    "crates/dbmr-bench",
    "crates/dbmr",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["eForge"]

[workspace.dependencies]
# Internal workspace crates
dbmr-core = { path = "crates/dbmr-core" }
dbmr-schema = { path = "crates/dbmr-schema" }
dbmr-adapters = { path = "crates/dbmr-adapters" }
dbmr-http = { path = "crates/dbmr-http" }
dbmr-kafka = { path = "crates/dbmr-kafka" }

# Serialization & Core types
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
indexmap = { version = "2.7", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
rust_decimal = { version = "1.36", features = ["serde", "serde-arbitrary-precision"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
thiserror = "2.0"

# Async & Runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
arc-swap = "1.7"
futures = "0.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cryptography & Security
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

# Web & Networking
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
hyper = "1.5"
bytes = "1.10"


# xtask
clap = { version = "4.5", features = ["derive"] }

# Testing
proptest = "1.6"

# Database drivers
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "rust_decimal", "chrono", "json", "uuid"] }
redis = { version = "0.28", default-features = false, features = ["tokio-comp"] }
mongodb = { version = "3.2", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tiberius = { version = "0.12", default-features = false, features = ["tokio", "rust_decimal", "chrono", "native-tls"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
implicit_hasher = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
double_must_use = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"

[profile.bench]
lto = true
codegen-units = 1
